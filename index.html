<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0010" />
    <meta name="color-scheme" content="dark" />
    <title>EIZ Metrics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /*
        Base global mínima. El look vive en inline styles (ver CLAUDE.md); acá solo va lo que
        los inline styles no pueden expresar: reset, foco accesible, hover, keyframes,
        scrollbars y preferencias del sistema (reduced motion).
      */
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
      html, body { margin: 0; min-height: 100%; background: #0a0010; color: #f3e8ff; }
      body { font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      #root { min-height: 100vh; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      a { color: inherit; }
      select option { background: #150a24; color: #f3e8ff; }
      ::placeholder { color: #6b7280; opacity: 1; }
      :focus-visible { outline: 2px solid #c084fc; outline-offset: 2px; border-radius: 8px; }
      ::selection { background: rgba(168,85,247,0.45); }

      /* Hover/active por atributo: los inline styles no tienen pseudo-clases */
      [data-hover="lift"] { transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; }
      [data-hover="lift"]:hover { transform: translateY(-1px); border-color: rgba(168,85,247,0.35) !important; box-shadow: 0 8px 28px rgba(0,0,0,0.35); }
      [data-hover="row"] { transition: background .15s ease, border-color .15s ease; }
      [data-hover="row"]:hover { background: rgba(168,85,247,0.09) !important; border-color: rgba(168,85,247,0.22) !important; }
      [data-hover="btn"] { transition: filter .15s ease, transform .1s ease, background .15s ease, border-color .15s ease; }
      [data-hover="btn"]:hover:not(:disabled) { filter: brightness(1.18); }
      [data-hover="btn"]:active:not(:disabled) { transform: scale(0.98); }
      [data-hover="nav"] { transition: color .15s ease, background .15s ease, border-color .15s ease; }
      [data-hover="nav"]:hover { color: #e2d4f0 !important; background: rgba(168,85,247,0.1) !important; }

      /* Scroll horizontal sin barra (chips, calendario, tablas en celular) */
      .eiz-scroll-x { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .eiz-scroll-x::-webkit-scrollbar { display: none; }
      .eiz-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      /* Scrollbar discreta en desktop */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.25); border-radius: 999px; border: 2px solid #0a0010; }
      ::-webkit-scrollbar-track { background: transparent; }

      @keyframes eiz-shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
      @keyframes eiz-fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes eiz-spin { to { transform: rotate(360deg); } }
      @keyframes eiz-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
      @keyframes eiz-glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes eiz-toast-in { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
